[project]
name = "gitdash"
version = "0.1.0"
description = "Multi-repo git TUI dashboard"
requires-python = ">=3.11"
dependencies = [
    "textual>=2.0.0,<9.0.0",
    "gitpython>=3.1.0",
    "pyte>=0.8.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]
openai = ["openai>=1.0.0"]
ai = ["anthropic>=0.30.0", "openai>=1.0.0"]
tray = ["pystray>=0.19.0", "Pillow>=10.0.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
gitdash = "gitdash.app:main"
gitdash-tray = "gitdash.tray:main"

[tool.setuptools.packages.find]
include = ["gitdash*"]
